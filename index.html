<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#365fdb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="영단어 카드">
  <title>영단어 플래시카드</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --blue: #365fdb;
      --blue-dark: #2449b8;
      --surface: #ffffff;
      --line: #dfe5f2;
      --bg: #f3f6fc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top left, #dfe9ff, transparent 38%), var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(100%, 680px);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 24px;
      background: rgba(255, 255, 255, .84);
      box-shadow: 0 18px 50px rgba(50, 76, 140, .16);
      backdrop-filter: blur(10px);
    }

    h1 { margin: 0; font-size: clamp(1.65rem, 5vw, 2.2rem); }
    .subtitle { margin: 8px 0 22px; color: var(--muted); }

    .install-tip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -8px 0 18px;
      padding: 11px 12px 11px 14px;
      border: 1px solid #cdd9fb;
      border-radius: 12px;
      background: #f2f5ff;
      color: #294a9a;
      font-size: .88rem;
      line-height: 1.45;
    }

    .install-tip[hidden] { display: none; }
    .install-tip button {
      flex: 0 0 auto;
      min-height: 32px !important;
      padding: 5px 8px !important;
      border-color: #c0cdf1 !important;
      background: white !important;
      color: #294a9a !important;
      font-size: .8rem !important;
    }

    .search {
      width: 100%;
      margin-bottom: 20px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      font: inherit;
    }

    .search:focus, button:focus-visible {
      outline: 3px solid rgba(54, 95, 219, .3);
      outline-offset: 2px;
    }

    .progress {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 10px;
      color: var(--muted);
      font-size: .92rem;
    }

    .card-area { perspective: 1100px; }

    .card {
      width: 100%;
      min-height: 270px;
      padding: 0;
      position: relative;
      border: 0;
      border-radius: 20px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform .45s ease;
      background: transparent;
      text-align: inherit;
    }

    .card.is-flipped { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 16px;
      padding: 30px;
      border-radius: 20px;
      backface-visibility: hidden;
      box-shadow: 0 14px 30px rgba(36, 73, 184, .16);
    }

    .front {
      background: linear-gradient(135deg, #446de2, #2449b8);
      color: white;
    }

    .back {
      transform: rotateY(180deg);
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .side-label {
      margin: 0;
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .12em;
      opacity: .78;
    }

    .word, .meaning {
      margin: 0;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .word { font-size: clamp(1.8rem, 7vw, 3rem); font-weight: 800; }
    .meaning { font-size: clamp(1.3rem, 4.5vw, 2rem); font-weight: 700; line-height: 1.45; }
    .hint { margin: 0; font-size: .88rem; opacity: .76; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    button:not(.card) {
      min-height: 46px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:not(.card):hover { border-color: #b9c8ef; background: #f8faff; }
    #toggle { background: var(--blue); border-color: var(--blue); color: white; }
    #toggle:hover { background: var(--blue-dark); }

    .utilities {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .utilities button { min-height: 38px; font-size: .9rem; }

    .quiz {
      margin-top: 28px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .quiz-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .quiz h2 { margin: 0; font-size: 1.35rem; }
    .quiz-description { margin: 0 0 14px; color: var(--muted); }

    .mode-controls, .quiz-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mode-controls { margin-bottom: 14px; }
    .mode-controls button { min-height: 40px; }
    .mode-controls button.is-selected { border-color: var(--blue); background: #eef2ff; color: var(--blue-dark); }

    .quiz-card {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f8faff;
    }

    .quiz-label { margin: 0 0 6px; color: var(--muted); font-size: .85rem; font-weight: 700; }
    .quiz-question { margin: 0; font-size: clamp(1.45rem, 5vw, 2.2rem); font-weight: 800; overflow-wrap: anywhere; }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .choice {
      min-height: 66px !important;
      padding: 12px !important;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .choice.is-correct { border-color: #16803c !important; background: #e8f8ec !important; color: #135e2f !important; }
    .choice.is-wrong { border-color: #bd3741 !important; background: #ffedef !important; color: #972b33 !important; }
    .choice:disabled { cursor: default; opacity: 1; }

    .quiz-footer { align-items: center; margin-top: 14px; }
    .quiz-feedback { flex: 1 1 180px; margin: 0; color: var(--muted); font-weight: 700; }
    .quiz-feedback.correct { color: #137234; }
    .quiz-feedback.wrong { color: #a12630; }
    #next-question { min-height: 42px; background: var(--blue); border-color: var(--blue); color: white; }
    #next-question:hover { background: var(--blue-dark); }

    .empty {
      min-height: 270px;
      display: grid;
      place-items: center;
      padding: 30px;
      border: 1px dashed #b8c5e4;
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
    }

    .empty[hidden] { display: none; }

    @media (max-width: 420px) {
      body { padding: 16px 10px; }
      .app { padding: 20px 16px; border-radius: 18px; }
      .controls { gap: 7px; }
      button:not(.card) { padding: 8px; font-size: .9rem; }
      .choices { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>영단어 플래시카드</h1>
    <p class="subtitle">카드를 클릭하거나 <strong>정답 보기</strong>를 누르면 뜻이 보입니다.</p>
    <div id="install-tip" class="install-tip" role="status">
      <span>Safari의 공유 버튼에서 <strong>홈 화면에 추가</strong>를 선택하면 앱처럼 사용할 수 있어요.</span>
      <button id="dismiss-install-tip" type="button" aria-label="안내 닫기">닫기</button>
    </div>

    <input id="search" class="search" type="search" placeholder="영단어 또는 뜻 검색" aria-label="영단어 또는 뜻 검색">

    <div class="progress">
      <span id="position">1 / 205</span>
      <span id="total">전체 205개</span>
    </div>

    <div id="card-area" class="card-area">
      <button id="flashcard" class="card" type="button" aria-label="카드를 뒤집어 뜻 보기">
        <span class="face front">
          <span class="side-label">ENGLISH</span>
          <span id="word" class="word"></span>
          <span class="hint">클릭해서 뜻 보기</span>
        </span>
        <span class="face back">
          <span class="side-label">뜻</span>
          <span id="meaning" class="meaning"></span>
          <span class="hint">클릭해서 단어 보기</span>
        </span>
      </button>
      <div id="empty" class="empty" hidden>검색 결과가 없습니다.<br>다른 검색어를 입력해 보세요.</div>
    </div>

    <div class="controls">
      <button id="previous" type="button">← 이전</button>
      <button id="toggle" type="button">정답 보기</button>
      <button id="next" type="button">다음 →</button>
    </div>

    <div class="utilities">
      <button id="random" type="button">무작위 카드</button>
      <button id="shuffle" type="button">순서 섞기</button>
      <button id="reset-search" type="button">검색 초기화</button>
    </div>

    <section class="quiz" aria-labelledby="quiz-title">
      <div class="quiz-heading">
        <h2 id="quiz-title">테스트</h2>
        <span id="test-score">정답 0 / 0</span>
      </div>
      <p class="quiz-description">알맞은 뜻 또는 영어 표현을 골라 보세요.</p>

      <div class="mode-controls" role="group" aria-label="테스트 방향">
        <button id="mode-en-ko" class="is-selected" type="button">영어 → 한글</button>
        <button id="mode-ko-en" type="button">한글 → 영어</button>
        <button id="reset-test" type="button">점수 초기화</button>
      </div>

      <div class="quiz-card">
        <p id="quiz-label" class="quiz-label">영어의 뜻을 고르세요</p>
        <p id="quiz-question" class="quiz-question"></p>
        <div id="choices" class="choices" aria-live="polite"></div>
        <div class="quiz-footer">
          <p id="quiz-feedback" class="quiz-feedback">정답 하나를 선택하세요.</p>
          <button id="next-question" type="button" disabled>다음 문제</button>
        </div>
      </div>
    </section>
  </main>

      ["jawbreaker", "알사탕"],
      ["colonizer", "본토에서 식민지로 이주한 사람"],
      ["filler word", "군더더기 말"],
      ["flavor profile", "맛의 구성, 맛의 특징"],
      ["call-out", "도움을 구하는 글, 공개적인 요청"],
      ["insistence", "고집"],
      ["escalate", "점점 심해지다, 악화되다"],
      ["entail", "수반하다, 의미하다"],
      ["outwit", "한 수 앞서다"],
      ["outcompete", "이기다, 앞서다"],
      ["weathering", "풍화"],
      ["repurpose", "재활용하다"],
      ["contested", "논란이 있는"],
      ["one-up", "한발 앞선, 한 수 위의"],
      ["unmet", "충족되지 않은"],
      ["sought-after", "많은 사람들이 원하는, 인기 있는"],
      ["downright", "매우, 아주"],
      ["affective", "감정적인, 정서적인, 감정의"],
      ["exclusively", "오직, 오로지"]
    ];

    let cards = [...allCards];
    let index = 0;
    let revealed = false;

    const card = document.getElementById("flashcard");
    const cardArea = document.getElementById("card-area");
    const empty = document.getElementById("empty");
    const word = document.getElementById("word");
    const meaning = document.getElementById("meaning");
    const position = document.getElementById("position");
    const total = document.getElementById("total");
    const toggle = document.getElementById("toggle");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const random = document.getElementById("random");
    const shuffle = document.getElementById("shuffle");
    const search = document.getElementById("search");
    const resetSearch = document.getElementById("reset-search");
    const modeEnKo = document.getElementById("mode-en-ko");
    const modeKoEn = document.getElementById("mode-ko-en");
    const resetTest = document.getElementById("reset-test");
    const quizLabel = document.getElementById("quiz-label");
    const quizQuestion = document.getElementById("quiz-question");
    const choices = document.getElementById("choices");
    const quizFeedback = document.getElementById("quiz-feedback");
    const nextQuestion = document.getElementById("next-question");
    const testScore = document.getElementById("test-score");
    const installTip = document.getElementById("install-tip");
    const dismissInstallTip = document.getElementById("dismiss-install-tip");

    let testMode = "en-ko";
    let correctAnswers = 0;
    let answeredQuestions = 0;
    let quiz = null;
    const scoreStorageKey = "english-flashcards-score-v1";
    const installTipStorageKey = "english-flashcards-install-tip-dismissed-v1";

    function render() {
      const hasCards = cards.length > 0;
      card.hidden = !hasCards;
      empty.hidden = hasCards;

      if (!hasCards) {
        position.textContent = "0 / 0";
        total.textContent = `전체 ${allCards.length}개`;
        [toggle, previous, next, random, shuffle].forEach((button) => button.disabled = true);
        return;
      }

      [toggle, previous, next, random, shuffle].forEach((button) => button.disabled = false);
      const [currentWord, currentMeaning] = cards[index];
      word.textContent = currentWord;
      meaning.textContent = currentMeaning;
      card.classList.toggle("is-flipped", revealed);
      toggle.textContent = revealed ? "단어 보기" : "정답 보기";
      card.setAttribute("aria-label", revealed ? "카드를 뒤집어 단어 보기" : "카드를 뒤집어 뜻 보기");
      position.textContent = `${index + 1} / ${cards.length}`;
      total.textContent = search.value ? `검색 결과 ${cards.length}개` : `전체 ${allCards.length}개`;
    }

    function flip() {
      if (!cards.length) return;
      revealed = !revealed;
      render();
    }

    function move(step) {
      if (!cards.length) return;
      index = (index + step + cards.length) % cards.length;
      revealed = false;
      render();
    }

    function shuffleCards() {
      for (let i = cards.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      index = 0;
      revealed = false;
      render();
    }

    function mix(items) {
      const mixed = [...items];
      for (let i = mixed.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [mixed[i], mixed[j]] = [mixed[j], mixed[i]];
      }
      return mixed;
    }

    function updateTestScore() {
      testScore.textContent = `정답 ${correctAnswers} / ${answeredQuestions}`;
      try {
        localStorage.setItem(scoreStorageKey, JSON.stringify({ correctAnswers, answeredQuestions }));
      } catch (_) {
        // Storage can be unavailable in private browsing; the quiz still works for this session.
      }
    }

    function restoreTestScore() {
      try {
        const savedScore = JSON.parse(localStorage.getItem(scoreStorageKey));
        if (
          Number.isInteger(savedScore?.correctAnswers) &&
          Number.isInteger(savedScore?.answeredQuestions) &&
          savedScore.correctAnswers >= 0 &&
          savedScore.answeredQuestions >= savedScore.correctAnswers
        ) {
          correctAnswers = savedScore.correctAnswers;
          answeredQuestions = savedScore.answeredQuestions;
        }
      } catch (_) {
        // Ignore unreadable saved data and start with a fresh score.
      }
    }

    function setupInstallTip() {
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      try {
        if (isStandalone || localStorage.getItem(installTipStorageKey) === "dismissed") {
          installTip.hidden = true;
        }
      } catch (_) {
        if (isStandalone) installTip.hidden = true;
      }
    }

    function newQuizQuestion() {
      const [english, korean] = allCards[Math.floor(Math.random() * allCards.length)];
      const questionIndex = testMode === "en-ko" ? 0 : 1;
      const answerIndex = testMode === "en-ko" ? 1 : 0;
      const answer = answerIndex === 0 ? english : korean;
      const options = new Set([answer]);

      while (options.size < 4) {
        const candidate = allCards[Math.floor(Math.random() * allCards.length)][answerIndex];
        options.add(candidate);
      }

      quiz = {
        answer,
        answered: false,
        options: mix([...options])
      };

      quizLabel.textContent = testMode === "en-ko" ? "영어의 뜻을 고르세요" : "한글에 알맞은 영어 표현을 고르세요";
      quizQuestion.textContent = questionIndex === 0 ? english : korean;
      choices.innerHTML = "";
      quizFeedback.textContent = "정답 하나를 선택하세요.";
      quizFeedback.className = "quiz-feedback";
      nextQuestion.disabled = true;

      quiz.options.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = option;
        button.addEventListener("click", () => answerQuiz(button, option));
        choices.appendChild(button);
      });
    }

    function answerQuiz(selectedButton, selectedAnswer) {
      if (!quiz || quiz.answered) return;
      quiz.answered = true;
      answeredQuestions += 1;
      const isCorrect = selectedAnswer === quiz.answer;

      [...choices.children].forEach((button) => {
        button.disabled = true;
        if (button.textContent === quiz.answer) button.classList.add("is-correct");
      });

      if (isCorrect) {
        correctAnswers += 1;
        quizFeedback.textContent = "정답입니다!";
        quizFeedback.className = "quiz-feedback correct";
      } else {
        selectedButton.classList.add("is-wrong");
        quizFeedback.textContent = `정답: ${quiz.answer}`;
        quizFeedback.className = "quiz-feedback wrong";
      }

      updateTestScore();
      nextQuestion.disabled = false;
      nextQuestion.focus();
    }

    function changeTestMode(mode) {
      testMode = mode;
      correctAnswers = 0;
      answeredQuestions = 0;
      modeEnKo.classList.toggle("is-selected", mode === "en-ko");
      modeKoEn.classList.toggle("is-selected", mode === "ko-en");
      updateTestScore();
      newQuizQuestion();
    }

    card.addEventListener("click", flip);
    toggle.addEventListener("click", flip);
    previous.addEventListener("click", () => move(-1));
    next.addEventListener("click", () => move(1));
    random.addEventListener("click", () => {
      if (cards.length < 2) return;
      let newIndex = index;
      while (newIndex === index) newIndex = Math.floor(Math.random() * cards.length);
      index = newIndex;
      revealed = false;
      render();
    });
    shuffle.addEventListener("click", shuffleCards);
    modeEnKo.addEventListener("click", () => changeTestMode("en-ko"));
    modeKoEn.addEventListener("click", () => changeTestMode("ko-en"));
    resetTest.addEventListener("click", () => {
      correctAnswers = 0;
      answeredQuestions = 0;
      updateTestScore();
      newQuizQuestion();
    });
    nextQuestion.addEventListener("click", newQuizQuestion);
    dismissInstallTip.addEventListener("click", () => {
      installTip.hidden = true;
      try {
        localStorage.setItem(installTipStorageKey, "dismissed");
      } catch (_) {
        // The tip remains hidden until this page is reloaded.
      }
    });

    search.addEventListener("input", () => {
      const query = search.value.trim().toLowerCase();
      cards = allCards.filter(([english, korean]) =>
        english.toLowerCase().includes(query) || korean.toLowerCase().includes(query)
      );
      index = 0;
      revealed = false;
      render();
    });

    resetSearch.addEventListener("click", () => {
      search.value = "";
      cards = [...allCards];
      index = 0;
      revealed = false;
      render();
      search.focus();
    });

    document.addEventListener("keydown", (event) => {
      if (["INPUT", "BUTTON"].includes(event.target.tagName) || event.target.isContentEditable) return;
      if (event.key === "ArrowLeft") move(-1);
      if (event.key === "ArrowRight") move(1);
      if (event.key === " " || event.key === "Enter") {
        event.preventDefault();
        flip();
      }
    });

    setupInstallTip();
    restoreTestScore();
    render();
    updateTestScore();
    newQuizQuestion();

    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {
          // The app remains usable online even if offline caching is unavailable.
        });
      });
    }
  </script>
</body>
</html>
